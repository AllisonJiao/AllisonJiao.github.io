<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziyi (Allison) Jiao — Personal</title>
<meta name="description" content="Ziyi (Allison) Jiao — M.Sc. Computer Science at UBC. Physics-based simulation and RL for character animation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'%3E%3Cpath fill='%231692dd' d='M3 0h1v2h-1zM2 2h3v1h-3zM0 3h7v1h-7zM2 4h3v1h-3zM3 5h1v2h-1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
:root{
  --ink:#0a2f52; --dim:#2d5f86; --accent:#1692dd; --grass:#4ea818; --pink:#e85a9a;
  --lcd-bg:#0f3d45; --lcd-bg2:#0a2d34; --lcd:#86ffd4; --lcd-dim:#4fd3a8;
  --win-bg:rgba(255,255,255,0.62); --win-ring:rgba(21,110,190,0.30);
  --title-bar:linear-gradient(180deg,#4db6ef 0%,#1a86cf 48%,#0b6fb3 52%,#1780c6 100%);
  --aqua-btn:linear-gradient(180deg,#8fe2ff 0%,#2fb0ec 46%,#0f8fd4 54%,#29a8e8 100%);
  --grass-btn:linear-gradient(180deg,#c6f58c 0%,#6cc72c 46%,#4ea818 54%,#67c02a 100%);
  --pixel:"Pixelify Sans",ui-monospace,monospace;
  --pixel-caps:"Silkscreen",ui-monospace,monospace;
  --lcd-font:"VT323",ui-monospace,monospace;
  --body:"M PLUS Rounded 1c","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;min-height:100vh;position:relative;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#2fa9ee 0%,#7fd0fb 900px,#c8ecff 1500px,#e9f8ff 2100px,#dff6d6 calc(100% - 300px),#bfe89a 100%);background-color:#e9f8ff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid #ffffff;outline-offset:2px;box-shadow:0 0 0 6px var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.px{shape-rendering:crispEdges;display:block}

/* ---------- wallpaper ---------- */
.wallpaper{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wallpaper .glare{position:absolute;inset:0;background:radial-gradient(900px 480px at 82% 0,rgba(255,255,255,0.95) 0%,rgba(255,250,210,0.5) 35%,transparent 70%),radial-gradient(900px 300px at 10% 400px,rgba(255,255,255,0.45) 0%,transparent 70%)}
.wallpaper .hill{position:absolute;left:-15%;right:-15%;bottom:-520px;height:900px;border-radius:50%;background:radial-gradient(60% 40% at 50% 12%,#c9f59a 0%,#7fcf3a 38%,#4fa51c 70%,#3d8c14 100%);box-shadow:inset 0 30px 60px rgba(255,255,255,0.55)}
.wallpaper .dither{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:.35;background:repeating-conic-gradient(rgba(255,255,255,0.5) 0 25%,transparent 0 50%) 0 0/4px 4px}
.deco{position:absolute}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,0.95) 0 12%,rgba(255,255,255,0.25) 30%,rgba(120,210,255,0.25) 70%,rgba(255,255,255,0.6) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.8)}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- taskbar ---------- */
.taskbar{position:sticky;top:0;z-index:30;min-height:60px;padding:8px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(255,255,255,0.94) 0%,rgba(235,248,255,0.82) 50%,rgba(205,236,255,0.78) 51%,rgba(225,245,255,0.9) 100%);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:2px solid #fff;box-shadow:0 4px 18px rgba(9,48,90,0.12)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--pixel-caps);font-size:18px}
.nav{display:flex;gap:4px;margin-left:auto;font-family:var(--pixel);font-size:17px}
.nav a{min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:10px;transition:background .15s}
.nav a:hover,.nav a[aria-current="true"]{background:rgba(255,255,255,0.85);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 1.5px rgba(21,110,190,0.25)}
.search{position:relative;width:240px}
.search input{width:100%;min-height:40px;padding:0 12px 0 34px;border:0;border-radius:999px;font:15px var(--pixel);color:var(--ink);background:rgba(255,255,255,0.85);box-shadow:inset 0 1px 3px rgba(9,48,90,0.18),0 0 0 1.5px rgba(21,110,190,0.25)}
.search input::placeholder{color:#5b83a3}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.results{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-width:90vw;padding:8px;border-radius:12px;background:#fff;box-shadow:0 0 0 2px var(--win-ring),0 18px 40px rgba(9,48,90,0.25);display:none;flex-direction:column;gap:2px}
.results.open{display:flex}
.results button{text-align:left;padding:10px 12px;border-radius:8px;display:flex;flex-direction:column;gap:2px;min-height:44px}
.results button:hover,.results button:focus-visible{background:#e2f4ff;outline:none;box-shadow:none}
.results .r-title{font-weight:700;font-size:14px}
.results .r-sub{font-family:var(--pixel);font-size:13px;color:var(--dim)}
.results .empty{padding:10px 12px;font-family:var(--pixel);font-size:14px;color:var(--dim)}
.status{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.7);box-shadow:inset 0 0 0 1.5px #fff,0 2px 6px rgba(9,48,90,0.12);font-family:var(--pixel);font-size:14px;color:var(--dim);white-space:nowrap}
.status i{width:8px;height:8px;background:#3fbf2a;box-shadow:0 0 6px #3fbf2a}

/* ---------- layout ---------- */
main{position:relative;z-index:1;width:min(1240px,calc(100% - 40px));margin:0 auto;padding:32px 0 150px;display:flex;flex-direction:column;gap:40px}
.view{display:flex;flex-direction:column;gap:40px;animation:fade .25s ease}

/* ---------- window ---------- */
.win{background:var(--win-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 2px var(--win-ring),0 18px 40px rgba(9,48,90,0.18);overflow:hidden;min-width:0}
.win-title{height:34px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--title-bar);color:#fff;font-family:var(--pixel-caps);font-size:13px;letter-spacing:.04em;text-shadow:0 1px 0 rgba(0,50,100,0.55)}
.win-title span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;border-radius:999px;font-weight:800;font-size:16px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn-aqua{color:#fff;text-shadow:0 1px 2px rgba(3,50,90,0.5);background:var(--aqua-btn);box-shadow:0 8px 22px rgba(14,140,214,0.40),inset 0 2px 0 rgba(255,255,255,0.8),inset 0 0 0 1.5px rgba(255,255,255,0.45)}
.btn-grass{color:#fff;text-shadow:0 1px 2px rgba(20,70,0,0.5);background:var(--grass-btn);box-shadow:0 8px 22px rgba(78,168,24,0.35),inset 0 2px 0 rgba(255,255,255,0.75),inset 0 0 0 1.5px rgba(255,255,255,0.45)}
.btn-glass{font-weight:700;font-size:15px;background:linear-gradient(180deg,#fff 0%,#e2f4ff 100%);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 1.5px rgba(21,110,190,0.3),0 4px 10px rgba(9,48,90,0.10)}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px}
.chip{padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,#fff 0%,#e2f4ff 100%);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 1.5px rgba(21,110,190,0.25),0 2px 6px rgba(9,48,90,0.10);font-family:var(--pixel);font-size:14px}
.tag-dark{align-self:flex-start;padding:3px 10px;background:var(--ink);color:#fff;font-family:var(--pixel-caps);font-size:12px}
.chrome{color:transparent;background:linear-gradient(180deg,#f4ffd9 0%,#b8f05a 38%,#4fb81c 52%,#9be84a 72%,#e9ffc4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #1f5f12;filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 8px 14px rgba(31,95,18,0.30))}

/* ---------- hero ---------- */
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.hello{padding:36px 40px 40px;display:flex;flex-direction:column;gap:22px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:15px;color:#2f7d12}
.hero-id{display:flex;align-items:center;gap:28px}
.avatar{position:relative;flex:none;width:148px;height:148px;border-radius:50%;padding:9px;background:linear-gradient(160deg,rgba(255,255,255,0.98) 0%,rgba(170,228,255,0.85) 40%,rgba(126,211,33,0.45) 75%,rgba(255,255,255,0.9) 100%);box-shadow:0 12px 28px rgba(9,48,90,0.25),0 0 0 2px #fff,0 0 30px rgba(79,201,240,0.55)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%}
.avatar::after{content:"";position:absolute;top:8%;left:15%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0));pointer-events:none}
.hero-name{margin:0;font-family:var(--pixel);font-weight:700;font-size:clamp(38px,5vw,68px);line-height:1.02;letter-spacing:.01em}
.hero-lede{margin:10px 0 0;font-size:17px;line-height:1.5;color:var(--dim)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:24px}
.lcd{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,var(--lcd-bg) 0%,var(--lcd-bg2) 100%);box-shadow:inset 0 3px 10px rgba(0,0,0,0.45),0 0 0 2px #fff;font-family:var(--lcd-font);color:var(--lcd);text-shadow:0 0 6px rgba(134,255,212,0.55)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,0.18) 0 1px,transparent 1px 3px)}
.lcd .d{color:var(--lcd-dim)}
.status-lcd{margin:16px;padding:18px 20px;font-size:22px;line-height:1.25}
.status-lcd .gap{height:10px}
.cursor{display:inline-block;width:10px;height:20px;margin-left:6px;vertical-align:-3px;background:var(--lcd);animation:blink 1s steps(1) infinite}
.welcome{margin-left:40px;width:320px;background:#f2f6fa;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 1.5px #3a6fa0,0 14px 30px rgba(9,48,90,0.25);overflow:hidden;transform:rotate(-2deg)}
.welcome .bar{height:28px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#0a4fa8 0%,#3a8ee6 100%);color:#fff;font-family:var(--pixel-caps);font-size:12px}
.welcome .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.welcome .msg{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.4}
.progress-px{height:14px;border:1.5px solid #3a6fa0;background:#fff;padding:2px}
.progress-px span{display:block;width:72%;height:100%;background:repeating-linear-gradient(90deg,#3fbf2a 0 8px,transparent 8px 10px)}
.welcome .ok{align-self:flex-end;min-height:44px;min-width:96px;display:grid;place-items:center;padding:0 16px;border-radius:4px;background:linear-gradient(180deg,#fff 0%,#dde6ee 100%);box-shadow:inset 0 0 0 1.5px #3a6fa0,0 2px 4px rgba(9,48,90,0.15);font-family:var(--pixel);font-size:15px}
.welcome .ok:hover{background:#fff}

/* ---------- featured ---------- */
.feat-row{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:32px;align-items:start}
.col{display:flex;flex-direction:column;gap:32px;min-width:0}
.feat{padding:20px;display:flex;flex-direction:column;gap:20px}
.feat-img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border:4px solid #fff;outline:2px solid rgba(21,110,190,0.35);border-radius:6px}
.feat-meta{display:flex;flex-direction:column;gap:8px;padding:0 4px 4px}
.feat-meta h2{margin:6px 0 0;font-weight:800;font-size:clamp(22px,2.4vw,28px);line-height:1.2;letter-spacing:-.01em}
.feat-meta .by{font-size:15px;color:var(--dim)}
.feat-meta .actions{margin-top:10px}
.list{padding:12px;display:flex;flex-direction:column;gap:6px}
.hl-row{width:100%;display:grid;grid-template-columns:28px 52px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,0.7);box-shadow:inset 0 0 0 1.5px #fff;text-align:left;transition:background .15s}
.hl-row:hover{background:rgba(255,255,255,0.95)}
.hl-row[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 1.5px #fff,0 0 0 2px var(--accent),0 4px 12px rgba(14,140,214,0.22)}
.hl-row[aria-pressed="true"] .n{color:var(--accent)}
.hl-row .art{overflow:hidden}
.hl-row .art img{width:100%;height:100%;object-fit:cover}
.hl-row.playing .n{animation:blink 1s steps(1) infinite}
.hl-row.paused .n{animation:none}
.feat.swap{animation:fade .3s ease}
.hl-row .n{font-family:var(--pixel);font-size:16px;color:var(--dim);text-align:center}
.hl-row .art{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,0.5)}
.hl-row .t{display:block;font-size:14px;font-weight:700;line-height:1.3}
.hl-row .s{display:block;font-size:13px;color:var(--dim);margin-top:3px}
.labs{padding:22px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.lab{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.orb{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--pixel);font-weight:700;font-size:24px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.35);box-shadow:inset 0 -6px 12px rgba(0,0,0,0.18),inset 0 0 0 2px rgba(255,255,255,0.6),0 8px 18px rgba(9,48,90,0.22);transition:transform .2s}
.lab:hover .orb{transform:scale(1.05)}
.lab .name{font-size:14px;font-weight:700;line-height:1.25}
.lab .role{font-family:var(--pixel);font-size:13px;color:var(--dim)}

/* ---------- albums ---------- */
.albums{padding:28px 24px 30px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.album-card{display:flex;flex-direction:column;gap:12px;text-align:left}
.album-card:hover .case{transform:translateY(-3px)}
.album-card:hover .disc{transform:translateX(12px) rotate(40deg)}
.case{position:relative;width:100%;aspect-ratio:270/210;transition:transform .2s}
.disc{position:absolute;left:26%;top:3.8%;width:71.8%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 9%,rgba(200,220,235,0.9) 9.5% 11%,transparent 11.5%),conic-gradient(from 20deg,#d9f3ff,#ffd6f2,#fff7c9,#cfffe6,#c9dcff,#ffd6f2,#d9f3ff);box-shadow:inset 0 0 0 2px rgba(255,255,255,0.9),0 6px 16px rgba(9,48,90,0.18);transition:transform .35s ease}
.cover{position:absolute;left:0;top:0;width:77.8%;aspect-ratio:1;border-radius:6px;overflow:hidden;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 10px 24px rgba(9,48,90,0.22)}
.cover::before{content:"";position:absolute;inset:0;opacity:.5;background:repeating-conic-gradient(rgba(255,255,255,0.35) 0 25%,transparent 0 50%) 0 0/6px 6px}
.cover::after{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0.05));border-radius:0 0 50% 50%/0 0 18% 18%}
.cover .lbl{position:relative;z-index:1;font-family:var(--pixel);font-weight:700;font-size:clamp(30px,3.4vw,44px);color:#fff}
.cover .yr{position:absolute;z-index:1;left:10px;bottom:8px;font-family:var(--pixel-caps);font-size:11px;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.album-card .t{font-size:16px;font-weight:800}
.album-card .s{font-family:var(--pixel);font-size:14px;color:var(--dim);margin-top:-6px}

/* ---------- about ---------- */
.about{padding:32px 36px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px}
.about h2{margin:0 0 14px;font-family:var(--pixel);font-weight:700;font-size:30px;color:#0b4f8c}
.about p{margin:0;font-size:16px;line-height:1.75;color:#1f4a6e;text-wrap:pretty}
.about .actions{margin-top:22px}
.props{margin:0;padding:20px 22px;border-radius:10px;background:rgba(226,244,255,0.8);box-shadow:inset 0 0 0 1.5px #fff;display:flex;flex-direction:column;gap:14px;align-self:start}
.props dt{font-family:var(--pixel-caps);font-size:12px;color:var(--dim);margin-bottom:2px}
.props dd{margin:0;font-size:15px;font-weight:700}

/* ---------- album detail ---------- */
.back{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 14px;border-radius:999px;font-family:var(--pixel);font-size:15px;background:linear-gradient(180deg,#fff 0%,#e2f4ff 100%);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 1.5px rgba(21,110,190,0.3),0 4px 10px rgba(9,48,90,0.12)}
.back b{font-size:20px;line-height:1;font-weight:400}
.album-head{padding:32px 36px 28px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:40px;align-items:center}
.album-head .case{width:360px}
.album-head .lbl{font-size:60px}
.album-head h1{margin:0;font-family:var(--pixel);font-weight:700;font-size:clamp(40px,4.4vw,60px);line-height:1.02}
.album-info{display:flex;flex-direction:column;gap:12px}
.album-info .artist{font-size:16px;font-weight:700;color:var(--accent)}
.album-info .meta{font-family:var(--pixel);font-size:15px;color:var(--dim)}
.album-info p{margin:2px 0 6px;font-size:16px;line-height:1.6;color:#1f4a6e}
.tracks{margin:0 24px 24px;border-radius:10px;background:rgba(255,255,255,0.75);box-shadow:inset 0 0 0 1.5px #fff,0 0 0 1.5px rgba(21,110,190,0.18);overflow:hidden}
.tracks .head,.track{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px}
.tracks .head{padding:10px 18px;background:linear-gradient(180deg,#f4fbff 0%,#deeffa 100%);border-bottom:1.5px solid rgba(21,110,190,0.18);font-family:var(--pixel-caps);font-size:12px;color:var(--dim)}
.track{width:100%;text-align:left;border-bottom:1.5px solid rgba(21,110,190,0.12);transition:background .12s}
.track:hover{background:rgba(226,244,255,0.8)}
.track.playing{background:rgba(207,238,255,0.85)}
.track .num{display:grid;place-items:center;height:28px;font-family:var(--pixel);font-size:18px;color:var(--dim)}
.track .t{display:block;font-size:16px;font-weight:800}
.track.playing .t{color:var(--accent)}
.track .s{display:block;font-size:14px;color:var(--dim);margin-top:3px}
.date-pill{justify-self:end;padding:4px 12px;border-radius:6px;background:var(--lcd-bg);color:var(--lcd);font-family:var(--lcd-font);font-size:19px;box-shadow:inset 0 2px 5px rgba(0,0,0,0.45);white-space:nowrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq span{width:4px;height:100%;background:var(--accent);animation:eq .9s ease-in-out infinite}

  spark: ['...#...', '...#...', '..###..', '#######', '..###..', '...#...', '...#...'],

  body:  ['...#.#...', '....#....', '....#....', '....#....', '....#....', '....#....', '.........']
};
function pathOf(rows) {
  let d = '';
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') d += `M${x} ${y}h1v1h-1z`; });
  return d;
}
function sprite(name, scale, color, extra) {
  const rows = name === 'fly' ? SPRITES.wing : SPRITES[name];
  const w = rows[0].length, h = rows.length, s = scale || 3;
  let inner = `<path fill="${color}" d="${pathOf(rows)}"/>`;
  if (name === 'fish') inner += '<path fill="#fff" d="M3 2h1v1h-1z"/>';
  if (name === 'fly') inner += `<path fill="${extra || '#0a2f52'}" d="${pathOf(SPRITES.body)}"/>`;
  return `<svg class="px" width="${w * s}" height="${h * s}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner}</svg>`;
}
const DEFAULT_COLORS = { cloud: '#ffffff', spark: '#ffffff', fish: '#ff7a1a', heart: '#e85a9a', note: '#ffffff' };
function hydrateSprites(root) {
  root.querySelectorAll('[data-sprite]').forEach(el => {
    const n = el.dataset.sprite;
    el.innerHTML = sprite(n, +el.dataset.scale || 3, el.dataset.color || DEFAULT_COLORS[n] || '#fff', el.dataset.body);
    if (el.dataset.flip) el.firstChild.style.transform = 'scaleX(-1)';
  });
}

/* ============================ state ============================ */
const state = { cur: null, playing: false, seg: 0, tab: 'abs', lastFocus: null, feat: 0 };
const SEGS = 20;
const $ = id => document.getElementById(id);
const app = $('app'), dlg = $('np');

function route() {
  const m = location.hash.match(/^#\/album\/(.+)$/);
  const ai = m ? ALL.findIndex((a, i) => i > 0 && !a.hidden && slug(a.title) === m[1]) : -1;
  if (ai > 0) {
    app.innerHTML = renderAlbum(ai);
    window.scrollTo({ top: 0, behavior: 'instant' });
  } else {
    const wasAlbum = app.dataset.view === 'album';
    if (app.dataset.view !== 'home') app.innerHTML = renderHome();
    const id = location.hash.slice(1);
    const target = id && !id.startsWith('/') && document.getElementById(id);
    if (target) requestAnimationFrame(() => target.scrollIntoView({ behavior: wasAlbum ? 'instant' : 'smooth', block: 'start' }));
  }
  app.dataset.view = ai > 0 ? 'album' : 'home';
  hydrateSprites(app);
  document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', String(ai > 0 && a.getAttribute('href') === '#albums')));
  syncRows();
}

function track() { return state.cur ? ALL[state.cur[0]].tracks[state.cur[1]] : null; }
function play(ai, ti, open = true) {
  const same = state.cur && state.cur[0] === ai && state.cur[1] === ti;
  if (same) state.playing = !state.playing;
  else { state.cur = [ai, ti]; state.playing = true; state.seg = 0; state.tab = 'abs'; }
  sync();
  if (open) openModal();
}
function step(dir) {
  if (!state.cur) return play(0, 0, false);
  const [ai, ti] = state.cur, n = ALL[ai].tracks.length;
  state.cur = [ai, (ti + dir + n) % n]; state.seg = 0; state.playing = true; state.tab = 'abs';
  sync();
}
function toggle() {
  if (!state.cur) return play(0, 0, false);
  state.playing = !state.playing; sync();
}

function syncRows() {
  document.querySelectorAll('[data-row]').forEach(el => {
    const on = state.cur && el.dataset.row === state.cur.join(':');
    el.classList.toggle('playing', !!on);
    el.classList.toggle('paused', !!on && !state.playing);
    const num = el.querySelector('.num');
    num.innerHTML = on ? '<span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="sr-only">now playing</span>' : String(+el.dataset.row.split(':')[1] + 1);
    el.setAttribute('aria-current', on ? 'true' : 'false');
  });
}
function syncSegs() {
  $('p-segs').innerHTML = Array.from({ length: 5 }, (_, i) => `<i class="${i < Math.ceil((state.seg / SEGS) * 5) ? 'on' : ''}"></i>`).join('');
  $('np-bar').innerHTML = Array.from({ length: SEGS }, (_, i) => `<i class="${i < state.seg ? 'on' : ''}"></i>`).join('');
}
function sync() {
  const t = track(), a = state.cur && ALL[state.cur[0]];
  const icon = state.playing ? ICON_PAUSE : ICON_PLAY, label = state.playing ? 'Pause' : 'Play';
  ['p-play', 'np-play'].forEach(id => { $(id).innerHTML = icon; $(id).setAttribute('aria-label', label); });
  $('p-text').textContent = t
    ? `${state.playing ? 'now playing' : 'paused'}: ${t.title} · ${a.title} #${state.cur[1] + 1}`
    : `pick a track to play · ${DATA.name}`;
  syncSegs();
  syncRows();
  if (state.cur && state.cur[0] === 0) setFeatured(state.cur[1]);
  document.querySelectorAll('[data-feature]').forEach(b => {
    const on = state.cur && state.cur[0] === 0 && state.cur[1] === +b.dataset.feature;
    b.classList.toggle('playing', !!on); b.classList.toggle('paused', !!on && !state.playing);
  });
  if (dlg.open) renderModal();
}

function renderModal() {
  const t = track(); if (!t) return;
  const a = ALL[state.cur[0]];
  const [c0, c1, c2] = ART[a.art] || ART.pubs;
  const cover = $('np-cover');
  cover.style.background = `linear-gradient(155deg,${c0} 0%,${c1} 100%)`;
  cover.innerHTML = t.img
    ? `<img src="${esc(t.img)}" alt="${esc(t.imgAlt || t.title)}"><span class="cap">${esc(a.title.toLowerCase())} · #${state.cur[1] + 1}</span>`
    : `<span class="bubble" style="left:30px;top:40px;width:70px;height:70px"></span>
       <span class="bubble" style="right:40px;bottom:50px;width:44px;height:44px"></span>
       <span style="position:absolute;right:60px;top:60px;z-index:1">${sprite('fish', 6, '#ff7a1a')}</span>
       <span class="lbl" style="text-shadow:5px 5px 0 ${c2}">${esc(a.label)}</span>
       <span class="cap">${esc(a.title.toLowerCase())} · #${state.cur[1] + 1}</span>`;
  $('np-state').textContent = state.playing ? '▶ now playing' : '❚❚ paused';
  $('np-time').textContent = t.time || '';
  $('np-title').textContent = t.title;
  $('np-sub').textContent = `${t.sub} — ${DATA.name}${t.tag ? ' · ' + t.tag : ''}`;
  $('tab-abs').setAttribute('aria-selected', String(state.tab === 'abs'));
  $('tab-links').setAttribute('aria-selected', String(state.tab === 'links'));
  const panel = $('np-panel');
  panel.setAttribute('aria-labelledby', state.tab === 'abs' ? 'tab-abs' : 'tab-links');
  if (state.tab === 'abs') {
    panel.innerHTML = `<h3>abstract / summary</h3>${t.abstract ? `<p>${esc(t.abstract)}</p>` : '<p class="empty">no summary yet.</p>'}`;
  } else {
    panel.innerHTML = `<h3>external links</h3>${t.links && t.links.length
      ? `<ul class="links">${t.links.map(([l, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener"><span class="l">${esc(l)}</span><span class="u">${esc(u.replace(/^https?:\/\//, '').replace(/\/$/, ''))} ↗</span></a></li>`).join('')}</ul>`
      : '<p class="empty">no external links for this one.</p>'}`;
  }
  syncSegs();
}
function openModal() {
  if (!state.cur) return;
  renderModal();
  if (!dlg.open) { state.lastFocus = document.activeElement; dlg.showModal(); }
}
function closeModal() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus(); });
dlg.addEventListener('click', e => { if (e.target === dlg) closeModal(); });

/* progress ticker */
setInterval(() => {
  if (!state.playing) return;
  state.seg = (state.seg + 1) % (SEGS + 1);
  syncSegs();
}, 1500);

/* events */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-feature]');
  if (f) {
    const i = +f.dataset.feature;
    setFeatured(i);
    if (!(state.cur && state.cur[0] === 0 && state.cur[1] === i && state.playing)) {
      state.cur = [0, i]; state.playing = true; state.seg = 0; state.tab = 'abs'; sync();
    }
    return;
  }
  const sm = e.target.closest('[data-summary]');
  if (sm) {
    const i = +sm.dataset.summary;
    if (!(state.cur && state.cur[0] === 0 && state.cur[1] === i)) { state.cur = [0, i]; state.playing = true; state.seg = 0; state.tab = 'abs'; sync(); }
    openModal(); return;
  }
  const p = e.target.closest('[data-play]');
  if (p) { const [ai, ti] = p.dataset.play.split(':').map(Number); play(ai, ti); return; }
  const s = e.target.closest('[data-shuffle]');
  if (s) { const ai = +s.dataset.shuffle; play(ai, Math.floor(Math.random() * ALL[ai].tracks.length)); }
});
$('p-screen').addEventListener('click', () => state.cur ? openModal() : play(0, 0));
$('p-play').addEventListener('click', toggle);
$('p-prev').addEventListener('click', () => step(-1));
$('p-next').addEventListener('click', () => step(1));
$('np-play').addEventListener('click', toggle);
$('np-prev').addEventListener('click', () => step(-1));
$('np-next').addEventListener('click', () => step(1));
$('np-close').addEventListener('click', closeModal);
$('tab-abs').addEventListener('click', () => { state.tab = 'abs'; renderModal(); });
$('tab-links').addEventListener('click', () => { state.tab = 'links'; renderModal(); });
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  state.tab = state.tab === 'abs' ? 'links' : 'abs'; renderModal();
  $(state.tab === 'abs' ? 'tab-abs' : 'tab-links').focus();
});

function showResults() {
  const v = q.value.trim().toLowerCase();
  if (!v) { res.classList.remove('open'); q.setAttribute('aria-expanded', 'false'); return; }
  const seen = new Set();
  const hits = INDEX.filter(x => x.hay.includes(v)).filter(x => { const k = x.t.title; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
  res.innerHTML = hits.length
    ? hits.map(x => `<button type="button" role="option" data-play="${x.ai}:${x.ti}"><span class="r-title">${esc(x.t.title)}</span><span class="r-sub">${esc(x.a.title.toLowerCase())} · ${esc(x.t.time)}</span></button>`).join('')
    : '<div class="empty">no tracks match that yet</div>';
  res.classList.add('open'); q.setAttribute('aria-expanded', 'true');
}
q.addEventListener('input', showResults);
q.addEventListener('focus', showResults);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { q.value = ''; showResults(); }
  if (e.key === 'ArrowDown') { const b = res.querySelector('button'); if (b) { e.preventDefault(); b.focus(); } }
  if (e.key === 'Enter') { const b = res.querySelector('button'); if (b) b.click(); }
});
res.addEventListener('keydown', e => {
  const items = [...res.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); i <= 0 ? q.focus() : items[i - 1].focus(); }
  if (e.key === 'Escape') { q.focus(); q.value = ''; showResults(); }
});
res.addEventListener('click', () => { q.value = ''; showResults(); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) { res.classList.remove('open'); q.setAttribute('aria-expanded', 'false'); } });

/* boot */
hydrateSprites(document);
window.addEventListener('hashchange', route);
route();
sync();
</script>
</body>
</html>
